<div class="container mx-auto p-4">
  <div class="flex justify-between mb-4">
    <h2 class="text-2xl font-bold">نظرات من</h2>
  </div>

  <!-- Empty -->
  @if (comments.length === 0) {
    <div class="text-center text-gray-400 py-10">
      هیچ نظری ثبت نشده است.
    </div>
  }

  <!-- Comments List -->
  @if (comments.length > 0) {
    <div class="grid grid-cols-1 gap-4">

      @for (item of comments; track item.id) {
        <div class="card bg-base-200 p-4 shadow-sm">
          <div class="flex justify-between items-start">
            <div>
              <p class="font-medium"><a class="link" [routerLink]="['/books', item.foreignId]">{{ item.comment }}</a></p>
              <p class="text-xs text-gray-400 mt-2">
                تاریخ: {{ item.createdAt | jalaliDate }}
              </p>
            </div>

            <div>
              <span class="badge"
                    [class.badge-success]="item.status"
                    [class.badge-warning]="!item.status">
                {{ item.status ? 'تایید شده' : 'در انتظار تایید' }}
              </span>
            </div>
          </div>
        </div>
      }

    </div>

    <!-- Pagination -->
    <div class="flex items-center justify-center my-5"
         *ngIf="pagination.totalPages > 1">

      <button class="btn btn-md"
              [disabled]="pagination.pageNumber === 1"
              (click)="changePage(pagination.pageNumber - 1)">
        قبلی
      </button>

      <ng-container *ngFor="let page of getPageArray()">
        <button class="btn btn-md"
                [ngClass]="{
                  'btn-disabled': page === -1,
                  'btn-primary': page === pagination.pageNumber
                }"
                (click)="page !== -1 && changePage(page)">
          @if (page === -1) {
            ...
          } @else {
            {{ page }}
          }
        </button>
      </ng-container>

      <button class="btn btn-md"
              [disabled]="pagination.pageNumber === pagination.totalPages"
              (click)="changePage(pagination.pageNumber + 1)">
        بعدی
      </button>

    </div>
  }
</div>
