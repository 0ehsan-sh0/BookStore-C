<div class="drawer md:drawer-open">
    <input id="admin-sidebar" type="checkbox" class="drawer-toggle" />
    <div class="drawer-content flex flex-col ">
        <!-- Page content here -->
        <ng-content></ng-content>
    </div>
    <div class="drawer-side h-screen">
        <label for="admin-sidebar" aria-label="close sidebar" class="drawer-overlay"></label>
        <ul class="menu bg-base-200 text-base-content min-h-full space-y-2 md:space-y-0 w-50">
            <!-- Sidebar content here -->
            <li>
                <a [routerLink]="['/admin']" class="text-md font-bold"> <i-lucide name="chart-column-big" size="16"
                        strokeWidth="3"></i-lucide>
                    داشبورد
                </a>
            </li>
            <div class="divider m-1"></div>
            <li>
                <a [routerLink]="['/admin/author']" class="text-md font-bold"> <i-lucide name="pencil-line" size="16"
                        strokeWidth="3"></i-lucide>
                    نویسندگان
                </a>
            </li>
            <li>
                <a [routerLink]="['/admin/book']" class="text-md font-bold"> <i-lucide name="book" size="16"
                        strokeWidth="3"></i-lucide>
                    کتاب ها
                </a>
            </li>
            <li>
                <a [routerLink]="['/admin/category']" class="text-md font-bold"> <i-lucide name="grid-2x2" size="16"
                        strokeWidth="3"></i-lucide>
                    دسته بندی ها
                </a>
            </li>
            <li>
                <a [routerLink]="['/admin/translator']" class="text-md font-bold"> <i-lucide name="book-type" size="16"
                        strokeWidth="3"></i-lucide>
                    مترجمان
                </a>
            </li>
            <li>
                <a [routerLink]="['/admin/tag']" class="text-md font-bold"> <i-lucide name="tag" size="16"
                        strokeWidth="3"></i-lucide>
                    تگ ها
                </a>
            </li>
            <div class="divider m-1"></div>
            <li>
                <a [routerLink]="['/admin/user']" class="text-md font-bold"> <i-lucide name="user" size="16"
                        strokeWidth="3"></i-lucide>
                    کاربران
                </a>
            </li>
            <div class="divider m-1"></div>
            <li>
                <a [routerLink]="['/admin/comment']" class="text-md font-bold"> <i-lucide name="message-circle-more"
                        size="16" strokeWidth="3"></i-lucide>
                    نظرات
                </a>
            </li>
            <div class="divider m-1"></div>
            <li>
                <a [routerLink]="['/admin/invoice']" class="text-md font-bold"> <i-lucide name="scroll-text" size="16"
                        strokeWidth="3"></i-lucide>
                    فاکتور ها
                </a>
            </li>
            <li>
                <a [routerLink]="['/admin/payment']" class="text-md font-bold"> <i-lucide name="dollar-sign" size="16"
                        strokeWidth="3"></i-lucide>
                    پرداخت ها
                </a>
            </li>
        </ul>
    </div>
</div>
