<h3 class="text-lg font-bold mb-3">بروزرسانی کاربر</h3>

<div class="mb-2">
  @for (error of this.errors; track $index) {
    <p class="text-error">{{error}}</p>
  }
</div>

<form #form="ngForm" (ngSubmit)="onSubmit(form)">
  <div class="space-y-2 mb-3">
    <label class="label">نام :</label>
    <input type="text" name="name"
           class="input sm:input-lg w-full"
           placeholder="نام"
           [(ngModel)]="user.name"
           required maxlength="200"
           #name="ngModel"
           [class.input-error]="name.invalid && name.touched" />
  </div>

  <div class="space-y-2 mb-3">
    <label class="label">نام خانوادگی :</label>
    <input type="text" name="lastName"
           class="input sm:input-lg w-full"
           placeholder="نام خانوادگی"
           [(ngModel)]="user.lastName"
           required maxlength="200"
           #lastName="ngModel"
           [class.input-error]="lastName.invalid && lastName.touched" />
  </div>

  <div class="space-y-2 mb-3">
    <label class="label">نقش :</label>
    <select name="role"
            class="select sm:select-lg w-full"
            [(ngModel)]="user.role"
            required
            #role="ngModel"
            [class.select-error]="role.invalid && role.touched">
      <option [ngValue]="userRole.Admin">مدیر</option>
      <option [ngValue]="userRole.User">کاربر</option>
    </select>
  </div>

  <button type="submit" [disabled]="form.invalid"
          class="btn btn-primary btn-lg w-full">بروزرسانی</button>
</form>
