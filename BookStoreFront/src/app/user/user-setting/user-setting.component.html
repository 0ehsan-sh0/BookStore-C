<!-- Settings section -->
<div data-section-panel="settings" class="section-panel">
    <div class="card bg-base-200 shadow-md p-4">
        <h3 class="text-xl font-bold mb-2">تنظیمات حساب</h3>

        <div class="grid grid-cols-1 gap-4">
            <div class="p-4 bg-base-100 rounded-lg shadow-sm">
                <h4 class="font-semibold">تغییر رمز عبور</h4>
                <form class="mt-3 space-y-3">
                    <input type="password" placeholder="رمز عبور فعلی" class="input input-bordered w-full" />
                    <input type="password" placeholder="رمز عبور جدید" class="input input-bordered w-full" />
                    <input type="password" placeholder="تکرار رمز عبور جدید" class="input input-bordered w-full" />
                    <div class="text-left">
                        <button class="btn btn-primary btn-sm">ذخیره</button>
                    </div>
                </form>
            </div>

            <div class="p-4 bg-base-100 rounded-lg shadow-sm">
                <h4 class="font-semibold">اعلان‌ها</h4>
                <div class="form-control mt-3 flex flex-col">
                    <label class="cursor-pointer label mb-2">
                        <span class="label-text">دریافت خبرنامه ایمیلی</span>
                        <input type="checkbox" class="toggle toggle-primary" checked />
                    </label>
                    <label class="cursor-pointer label">
                        <span class="label-text">پیامک وضعیت سفارش</span>
                        <input type="checkbox" class="toggle" checked />
                    </label>
                </div>
            </div>
        </div>

    </div>
</div>
