<!-- Profile section -->
<div data-section-panel="profile" class="section-panel">
    <div class="card bg-base-200 shadow-md mb-6">
        <div class="card-body">
            <div class="flex flex-col md:flex-row gap-6">
                <div class="md:w-1/3">
                    <div class="text-right">
                        <h2 class="text-2xl font-bold">پروفایل شما</h2>
                        <p class="text-gray-500 mt-1">اطلاعات پایه حساب و وضعیت اشتراک</p>
                    </div>

                    <div class="mt-4 space-y-3">
                        <div class="text-right">
                            <label class="text-sm text-gray-500">نام</label>
                            <div class="font-semibold">{{ user.name }} {{ user.lastName }}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-sm text-gray-500">شماره تماس</div>
                            <div class="font-semibold">{{ user.mobile }}</div>
                        </div>
                    </div>
                </div>

                <div class="md:w-2/3">
                    <form #form="ngForm" (ngSubmit)="onSubmit(form)" class="space-y-4">
                        <div class="flex flex-col lg:flex-row justify-between gap-2">
                            <div class="form-control md:flex-1 mb-2">

                                <label class="label mb-1 ml-2"><span class="label-text">نام شخص</span></label>

                                <input type="text" placeholder="نام" class="input input-bordered"
                                    [(ngModel)]="user.name" name="name" required maxlength="200" #name="ngModel"
                                    [class.input-error]="name.invalid && name.touched" />
                            </div>
                            <div class="form-control md:flex-1">

                                <label class="label mb-1 ml-2"><span class="label-text">نام خانوادگی</span></label>

                                <input type="text" placeholder="نام خانوادگی" class="input input-bordered"
                                    [(ngModel)]="user.lastName" name="lastname" required maxlength="200"
                                    #lastName="ngModel" [class.input-error]="lastName.invalid && lastName.touched" />
                            </div>
                        </div>

                        <div class="flex items-center justify-between">
                            <div class="flex gap-2">
                                <button type="submit" [disabled]="form.invalid" class="btn btn-primary">ذخیره
                                    تغییرات</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="card bg-base-200 p-4 shadow-sm text-right">
            <div class="text-sm text-gray-500">سفارش‌های فعال</div>
            <div class="text-2xl font-bold mt-2">{{ ordersCount }}</div>
        </div>
        <div class="card bg-base-200 p-4 shadow-sm text-right">
            <div class="text-sm text-gray-500">کتاب‌های ذخیره شده</div>
            <div class="text-2xl font-bold mt-2">{{ wishlistCount }}</div>
        </div>
        <div class="card bg-base-200 p-4 shadow-sm text-right">
            <div class="text-sm text-gray-500">کیف پول</div>
            <div class="text-2xl font-bold mt-2">200,000 تومان</div>
        </div>
    </div>
</div>
