<h3 class="text-lg font-bold mb-3">ایجاد آدرس جدید</h3>

<!-- Error Box -->
<div class="mb-3">
    @for (error of this.errors; track $index) {
    <p class="text-error">{{ error }}</p>
    }
</div>

<form #form="ngForm" (ngSubmit)="onSubmit(form)">
    <div class="space-y-2 mb-3">
        <label class="label">نام :</label>
        <input type="text" class="input w-full" name="name" placeholder="نام گیرنده" ngModel required maxlength="200"
            #name="ngModel" [class.input-error]="name.invalid && name.touched">
    </div>

    <div class="space-y-2 mb-3">
        <label class="label">نام خانوادگی :</label>
        <input type="text" class="input w-full" name="lastName" placeholder="نام خانوادگی" ngModel required
            maxlength="200" #lastName="ngModel" [class.input-error]="lastName.invalid && lastName.touched">
    </div>

    <div class="space-y-2 mb-3">
        <label class="label">شماره موبایل :</label>
        <input type="text" class="input w-full" name="phone" placeholder="مثال: 09123456789" ngModel required
            pattern="^09\d{9}$" #phone="ngModel" [class.input-error]="phone.invalid && phone.touched">
    </div>

    <div class="space-y-2 mb-3">
        <label class="label">کد پستی :</label>
        <input type="text" class="input w-full" name="postCode" placeholder="10 رقم" ngModel required pattern="^\d{10}$"
            maxlength="10" #postCode="ngModel" [class.input-error]="postCode.invalid && postCode.touched">
    </div>

    <div class="space-y-2 mb-3">
        <label class="label">استان :</label>
        <input type="text" class="input w-full" name="state" placeholder="استان" ngModel required #state="ngModel"
            [class.input-error]="state.invalid && state.touched">
    </div>

    <div class="space-y-2 mb-3">
        <label class="label">شهر :</label>
        <input type="text" class="input w-full" name="city" placeholder="شهر" ngModel required #city="ngModel"
            [class.input-error]="city.invalid && city.touched">
    </div>

    <div class="space-y-2 mb-3">
        <label class="label">آدرس کامل :</label>
        <textarea class="textarea w-full" name="address" placeholder="آدرس دقیق" ngModel required #address="ngModel"
            [class.input-error]="address.invalid && address.touched"></textarea>
    </div>

    <button type="submit" [disabled]="form.invalid" class="btn btn-primary btn-lg w-full">
        ایجاد آدرس
    </button>
</form>
